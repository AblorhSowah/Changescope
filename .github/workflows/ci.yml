name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, lint and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-test.log
      - name: Name the failing unit tests in an annotation
        if: failure()
        shell: bash
        run: |
          # The job log needs a GitHub login to read; annotations do not. Copy the failing tests and their errors into one.
          [ -f unit-test.log ] || exit 0
          body=$( { grep -nE '(^|[[:space:]])(not ok|✖)|failing tests|AssertionError|Error:|budget is|expected|actual' unit-test.log | head -60 || true; echo '--- last lines ---'; tail -n 25 unit-test.log; } | head -c 7000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing unit tests (${RUNNER_OS})::${body}"

  integration:
    name: integration tests (ubuntu, xvfb)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Libraries VS Code needs to start
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libgtk-3-0 libxss1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # downloads the current stable VS Code into .vscode-test on the first run
      - name: Integration tests
        shell: bash
        env:
          # Real VS Code on a shared runner has rare timing flakes; a failed test is re-run once and listed in a warning (next step).
          FS_TEST_RETRIES: '1'
        run: |
          set -o pipefail
          xvfb-run -a npm run test:integration 2>&1 | tee integration-test.log
      - name: List integration tests that passed only on retry
        if: always()
        shell: bash
        run: |
          [ -f integration-test.log ] || exit 0
          flaky=$( { grep -F '[flaky]' integration-test.log || true; } | head -20 | cut -c1-500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$flaky" ]; then echo "::warning title=Flaky integration tests (re-run once)::${flaky}"; fi
      - name: Name the failing integration tests in an annotation
        if: failure()
        shell: bash
        run: |
          # The job log needs a GitHub login to read; annotations do not. Copy each failing test and its error into one.
          [ -f integration-test.log ] || exit 0
          body=$( { sed 's/\x1b\[[0-9;]*m//g' integration-test.log | awk '/^ +[0-9]+ failing/{f=1} f' | { grep -vE '^[[:space:]]+at ' || true; } | head -70; echo '--- variants ---'; grep -E 'runTest\] (variant|failed)' integration-test.log || true; } | head -c 7000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing integration tests::${body}"
